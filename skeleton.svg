<svg width="360" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="50%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
  </defs>

  <!-- 白色背景底板 -->
  <rect width="360" height="600" rx="16" fill="#ffffff" />
  
  <!-- 顶部：头像 + 标题 -->
  <circle cx="40" cy="40" r="28" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <rect x="84" y="20" width="240" height="18" rx="9" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="84" y="48" width="180" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- 正文段落（多行） -->
  <rect x="20" y="100" width="320" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="20" y="126" width="290" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="20" y="152" width="260" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="20" y="178" width="300" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="20" y="204" width="240" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- 第一个大图/内容块 -->
  <rect x="20" y="240" width="320" height="140" rx="12" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- 中间分隔文字行 -->
  <rect x="20" y="400" width="200" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect x="20" y="426" width="280" height="14" rx="7" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- 第二个大图/内容块 -->
  <rect x="20" y="460" width="320" height="110" rx="12" fill="url(#shimmer)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
  </rect>
</svg>