<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕监控与录制工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e6e6e6;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(25, 25, 35, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            padding: 25px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2d4059;
        }
        
        h1 {
            color: #4cc9f0;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .control-panel {
            flex: 1;
            min-width: 300px;
            background-color: rgba(30, 30, 40, 0.8);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .preview-panel {
            flex: 2;
            min-width: 400px;
            background-color: rgba(30, 30, 40, 0.8);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .section-title {
            color: #4cc9f0;
            font-size: 1.4rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d4059;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #d0d0d0;
        }
        
        select, input[type="range"] {
            width: 100%;
            padding: 10px 15px;
            background-color: #2d4059;
            border: 1px solid #3a506b;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        select:focus, input[type="range"]:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
        }
        
        .range-value {
            display: inline-block;
            margin-left: 10px;
            color: #4cc9f0;
            font-weight: bold;
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            min-width: 150px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4cc9f0 0%, #3a86ff 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(58, 134, 255, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(247, 37, 133, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(46, 204, 113, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .video-container {
            width: 100%;
            height: 400px;
            background-color: #121212;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #2d4059;
            position: relative;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        
        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 1.2rem;
        }
        
        .video-placeholder i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #3a506b;
        }
        
        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(247, 37, 133, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 1.5s infinite;
            z-index: 10;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .recording-timer {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 10;
        }
        
        .video-info {
            background-color: rgba(30, 30, 40, 0.9);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .info-label {
            color: #a0a0a0;
        }
        
        .info-value {
            color: #4cc9f0;
            font-weight: 600;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .status-success {
            background-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.5);
        }
        
        .status-error {
            background-color: rgba(247, 37, 133, 0.2);
            color: #f72585;
            border: 1px solid rgba(247, 37, 133, 0.5);
        }
        
        .status-info {
            background-color: rgba(76, 201, 240, 0.2);
            color: #4cc9f0;
            border: 1px solid rgba(76, 201, 240, 0.5);
        }
        
        .download-section {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #2d4059;
        }
        
        .download-link {
            display: inline-block;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(46, 204, 113, 0.4);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2d4059;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .control-panel, .preview-panel {
                min-width: 100%;
            }
            
            .video-container {
                height: 300px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-desktop"></i> 屏幕监控与录制工具</h1>
            <p class="subtitle">使用浏览器API实现屏幕共享、录制和下载功能。支持选择录制区域、调整帧率和质量设置。</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <h2 class="section-title"><i class="fas fa-sliders-h"></i> 控制面板</h2>
                
                <div class="form-group">
                    <label for="shareType"><i class="fas fa-expand"></i> 选择共享类型</label>
                    <select id="shareType">
                        <option value="screen">整个屏幕</option>
                        <option value="window">应用窗口</option>
                        <option value="tab">浏览器标签页</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="frameRate"><i class="fas fa-tachometer-alt"></i> 帧率 (FPS)</label>
                    <input type="range" id="frameRate" min="5" max="60" value="30">
                    <span id="frameRateValue" class="range-value">30</span>
                </div>
                
                <div class="form-group">
                    <label for="quality"><i class="fas fa-star"></i> 视频质量</label>
                    <select id="quality">
                        <option value="high">高质量</option>
                        <option value="medium" selected>中等质量</option>
                        <option value="low">较低质量</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="includeAudio"><i class="fas fa-volume-up"></i> 包含音频</label>
                    <select id="includeAudio">
                        <option value="true">包含系统音频</option>
                        <option value="false" selected>不包含音频</option>
                    </select>
                </div>
                
                <div class="btn-group">
                    <button id="startBtn" class="btn-primary">
                        <i class="fas fa-play-circle"></i> 开始监控
                    </button>
                    <button id="recordBtn" class="btn-danger" disabled>
                        <i class="fas fa-record-vinyl"></i> 开始录制
                    </button>
                    <button id="stopBtn" class="btn-success" disabled>
                        <i class="fas fa-stop-circle"></i> 停止录制
                    </button>
                </div>
                
                <div id="status" class="status-message status-info">
                    准备好开始屏幕监控
                </div>
                
                <div id="downloadSection" class="download-section">
                    <h2 class="section-title"><i class="fas fa-download"></i> 下载录制视频</h2>
                    <p>录制已完成！点击下方链接下载视频文件：</p>
                    <a id="downloadLink" class="download-link" href="#" download="screen-recording.webm">
                        <i class="fas fa-file-video"></i> 下载录制视频
                    </a>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #a0a0a0;">
                        文件格式: WebM | 建议使用 Chrome、Edge 或 Firefox 播放
                    </p>
                </div>
            </div>
            
            <div class="preview-panel">
                <h2 class="section-title"><i class="fas fa-video"></i> 视频预览</h2>
                
                <div class="video-container">
                    <div id="videoPlaceholder" class="video-placeholder">
                        <i class="fas fa-desktop"></i>
                        <p>预览区域 - 开始监控后显示</p>
                    </div>
                    <video id="screenVideo" autoplay playsinline style="display: none;"></video>
                    
                    <div id="recordingIndicator" class="recording-indicator" style="display: none;">
                        <i class="fas fa-circle"></i> 正在录制
                    </div>
                    
                    <div id="recordingTimer" class="recording-timer" style="display: none;">
                        00:00:00
                    </div>
                </div>
                
                <div class="video-info">
                    <div class="info-row">
                        <span class="info-label">录制状态:</span>
                        <span id="recordStatus" class="info-value">未开始</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">视频尺寸:</span>
                        <span id="videoDimensions" class="info-value">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">录制时长:</span>
                        <span id="recordingDuration" class="info-value">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">文件大小:</span>
                        <span id="fileSize" class="info-value">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>屏幕监控工具 &copy; 2023 | 使用现代浏览器API实现 | 所有录制内容仅保存在本地</p>
            <p style="margin-top: 5px; font-size: 0.8rem;">
                <i class="fas fa-info-circle"></i> 注意：开始监控前需要授予屏幕共享权限
            </p>
        </footer>
    </div>
    
    <script>
        // DOM元素引用
        const startBtn = document.getElementById('startBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const screenVideo = document.getElementById('screenVideo');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recordingTimer = document.getElementById('recordingTimer');
        const statusDiv = document.getElementById('status');
        const downloadSection = document.getElementById('downloadSection');
        const downloadLink = document.getElementById('downloadLink');
        const frameRateSlider = document.getElementById('frameRate');
        const frameRateValue = document.getElementById('frameRateValue');
        const recordStatus = document.getElementById('recordStatus');
        const videoDimensions = document.getElementById('videoDimensions');
        const recordingDuration = document.getElementById('recordingDuration');
        const fileSize = document.getElementById('fileSize');
        
        // 状态变量
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingStartTime = null;
        let timerInterval = null;
        let recordedBlob = null;
        
        // 更新帧率显示
        frameRateSlider.addEventListener('input', function() {
            frameRateValue.textContent = this.value;
        });
        
        // 开始屏幕监控
        startBtn.addEventListener('click', async () => {
            try {
                // 获取用户选择的设置
                const shareType = document.getElementById('shareType').value;
                const frameRate = parseInt(frameRateSlider.value);
                const quality = document.getElementById('quality').value;
                const includeAudio = document.getElementById('includeAudio').value === 'true';
                
                // 根据质量设置调整分辨率
                let videoConstraints = {
                    frameRate: { ideal: frameRate, max: 60 },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                };
                
                // 根据质量设置调整比特率
                let bitrate = 2500000; // 默认 2.5 Mbps
                if (quality === 'high') bitrate = 5000000; // 5 Mbps
                if (quality === 'low') bitrate = 1000000; // 1 Mbps
                
                // 请求屏幕共享权限
                const displayOptions = {
                    video: videoConstraints,
                    audio: includeAudio
                };
                
                // 检查浏览器是否支持getDisplayMedia
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    throw new Error('您的浏览器不支持屏幕共享功能。请使用Chrome、Edge或Firefox最新版本。');
                }
                
                mediaStream = await navigator.mediaDevices.getDisplayMedia(displayOptions);
                
                // 显示视频流
                screenVideo.srcObject = mediaStream;
                screenVideo.style.display = 'block';
                videoPlaceholder.style.display = 'none';
                
                // 更新视频尺寸信息
                const videoTrack = mediaStream.getVideoTracks()[0];
                const settings = videoTrack.getSettings();
                videoDimensions.textContent = `${settings.width} × ${settings.height}`;
                
                // 更新按钮状态
                startBtn.disabled = true;
                recordBtn.disabled = false;
                stopBtn.disabled = true;
                
                // 更新状态信息
                updateStatus('屏幕监控已启动，可以开始录制', 'success');
                recordStatus.textContent = '监控中';
                
                // 监听用户停止共享（通过浏览器UI）
                mediaStream.getVideoTracks()[0].addEventListener('ended', () => {
                    stopScreenShare();
                    updateStatus('屏幕共享已被用户停止', 'error');
                });
                
            } catch (error) {
                console.error('屏幕监控启动失败:', error);
                updateStatus(`启动失败: ${error.message}`, 'error');
            }
        });
        
        // 开始录制
        recordBtn.addEventListener('click', () => {
            if (!mediaStream) {
                updateStatus('请先启动屏幕监控', 'error');
                return;
            }
            
            try {
                // 获取用户选择的设置
                const frameRate = parseInt(frameRateSlider.value);
                const quality = document.getElementById('quality').value;
                
                // 根据质量设置调整比特率
                let bitrate = 2500000; // 默认 2.5 Mbps
                if (quality === 'high') bitrate = 5000000; // 5 Mbps
                if (quality === 'low') bitrate = 1000000; // 1 Mbps
                
                // 配置录制选项
                const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') 
                    ? 'video/webm; codecs=vp9' 
                    : MediaRecorder.isTypeSupported('video/webm; codecs=vp8') 
                        ? 'video/webm; codecs=vp8' 
                        : 'video/webm';
                
                const options = {
                    mimeType: mimeType,
                    videoBitsPerSecond: bitrate
                };
                
                // 创建MediaRecorder实例
                mediaRecorder = new MediaRecorder(mediaStream, options);
                recordedChunks = [];
                
                // 收集录制的数据块
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                // 录制完成
                mediaRecorder.onstop = () => {
                    // 创建Blob
                    recordedBlob = new Blob(recordedChunks, { type: mimeType });
                    
                    // 创建下载链接
                    const videoURL = URL.createObjectURL(recordedBlob);
                    downloadLink.href = videoURL;
                    downloadLink.download = `screen-recording-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.webm`;
                    
                    // 显示下载区域
                    downloadSection.style.display = 'block';
                    
                    // 更新文件大小信息
                    const sizeInMB = (recordedBlob.size / (1024 * 1024)).toFixed(2);
                    fileSize.textContent = `${sizeInMB} MB`;
                    
                    // 停止计时器
                    clearInterval(timerInterval);
                    recordingTimer.style.display = 'none';
                    recordingIndicator.style.display = 'none';
                    
                    // 更新按钮状态
                    recordBtn.disabled = false;
                    stopBtn.disabled = true;
                    
                    // 更新状态信息
                    updateStatus('录制已完成！可以下载视频文件', 'success');
                    recordStatus.textContent = '录制完成';
                };
                
                // 开始录制
                mediaRecorder.start(1000); // 每1秒收集一次数据
                recordingStartTime = new Date();
                
                // 显示录制指示器
                recordingIndicator.style.display = 'flex';
                recordingTimer.style.display = 'block';
                
                // 开始计时器
                startTimer();
                
                // 更新按钮状态
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                
                // 更新状态信息
                updateStatus('正在录制屏幕...', 'info');
                recordStatus.textContent = '录制中';
                
            } catch (error) {
                console.error('录制启动失败:', error);
                updateStatus(`录制启动失败: ${error.message}`, 'error');
            }
        });
        
        // 停止录制
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                
                // 计算录制时长
                const duration = Math.floor((new Date() - recordingStartTime) / 1000);
                const hours = Math.floor(duration / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((duration % 3600) / 60).toString().padStart(2, '0');
                const seconds = (duration % 60).toString().padStart(2, '0');
                recordingDuration.textContent = `${hours}:${minutes}:${seconds}`;
            }
        });
        
        // 停止屏幕共享
        function stopScreenShare() {
            // 停止录制（如果正在录制）
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            // 停止媒体流
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                screenVideo.srcObject = null;
                mediaStream = null;
            }
            
            // 隐藏视频，显示占位符
            screenVideo.style.display = 'none';
            videoPlaceholder.style.display = 'flex';
            
            // 重置按钮状态
            startBtn.disabled = false;
            recordBtn.disabled = true;
            stopBtn.disabled = true;
            
            // 隐藏录制指示器
            recordingIndicator.style.display = 'none';
            recordingTimer.style.display = 'none';
            
            // 停止计时器
            clearInterval(timerInterval);
            
            // 更新状态信息
            recordStatus.textContent = '未开始';
            videoDimensions.textContent = '-';
            recordingDuration.textContent = '-';
            fileSize.textContent = '-';
        }
        
        // 开始计时器
        function startTimer() {
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const now = new Date();
                const duration = Math.floor((now - recordingStartTime) / 1000);
                
                const hours = Math.floor(duration / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((duration % 3600) / 60).toString().padStart(2, '0');
                const seconds = (duration % 60).toString().padStart(2, '0');
                
                recordingTimer.textContent = `${hours}:${minutes}:${seconds}`;
                
                // 更新录制时长显示
                recordingDuration.textContent = `${hours}:${minutes}:${seconds}`;
            }, 1000);
        }
        
        // 更新状态消息
        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status-message';
            
            switch(type) {
                case 'success':
                    statusDiv.classList.add('status-success');
                    break;
                case 'error':
                    statusDiv.classList.add('status-error');
                    break;
                case 'info':
                    statusDiv.classList.add('status-info');
                    break;
            }
        }
        
        // 页面卸载前清理资源
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            
            // 清理创建的URL对象
            if (downloadLink.href.startsWith('blob:')) {
                URL.revokeObjectURL(downloadLink.href);
            }
        });
        
        // 初始化页面
        updateStatus('点击"开始监控"按钮启动屏幕共享', 'info');
    </script>
